<div id="gaussian-wave-visual" role="group" aria-labelledby="gw-heading">
  <style>
    #gaussian-wave-visual {
      color: CanvasText;
      font-size: var(--font-size-base, 16px);
      font-family: system-ui, sans-serif;
    }
    #gaussian-wave-visual h3 {
      margin-block: 0 0.75rem;
      font-weight: 500;
    }
    #gaussian-wave-visual .gw-svg {
      display: block;
      width: 100%;
      height: auto;
      overflow: visible;
    }
    #gaussian-wave-visual .gw-axis path,
    #gaussian-wave-visual .gw-axis line,
    #gaussian-wave-visual .gw-frame {
      stroke: currentColor;
      stroke-width: 1;
    }
    #gaussian-wave-visual .gw-axis text,
    #gaussian-wave-visual .axis-title {
      fill: currentColor;
      font-size: 12px;
    }
    #gaussian-wave-visual .gw-axis .tick line {
      opacity: 0.48;
    }
    #gaussian-wave-visual .gw-zero {
      stroke: GrayText;
      stroke-width: 1;
      stroke-dasharray: 2 4;
    }
    #gaussian-wave-visual .gw-initial {
      fill: none;
      stroke: GrayText;
      stroke-width: 1.6;
      stroke-dasharray: 5 5;
    }
    #gaussian-wave-visual .gw-current {
      fill: none;
      stroke: Highlight;
      stroke-width: 2.4;
    }
    #gaussian-wave-visual .gw-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem 1rem;
      margin-block-start: 0.35rem;
    }
    #gaussian-wave-visual .gw-key {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0;
      border: 0;
      background: transparent;
      color: CanvasText;
      font: inherit;
      cursor: pointer;
    }
    #gaussian-wave-visual .gw-swatch {
      display: inline-block;
      width: 1.25rem;
      height: 0;
      border-top: 2px solid Highlight;
    }
    #gaussian-wave-visual .gw-swatch.initial {
      border-top-color: GrayText;
      border-top-style: dashed;
    }
    #gaussian-wave-visual .gw-key[aria-pressed="false"] .gw-swatch {
      opacity: 0.35;
    }
  </style>

  <h3 id="gw-heading">One Gaussian, three kinds of evolution</h3>

  <div class="viz-controls">
    <label class="form-label" for="gw-model">
      Wave model
      <select class="form-select" id="gw-model">
        <option value="wave3d" selected>3D radial wave (geometry)</option>
        <option value="wave1d">1D wave (no spreading)</option>
        <option value="kg3d">3D Klein–Gordon (mass + geometry)</option>
      </select>
    </label>
    <label class="form-label" for="gw-time">
      Scaled time, ct / R₀: <output id="gw-time-value" for="gw-time" class="tabular-nums">0.00</output>
      <input class="form-range" id="gw-time" type="range" min="0" max="5" step="0.02" value="0" aria-valuetext="0.00 R0 over c">
    </label>
    <button class="btn btn-primary" id="gw-play" type="button" aria-pressed="false">Play</button>
  </div>

  <p id="gw-description" aria-live="polite">Fixed, open view: the radial shell weakens as it expands and exits without reflecting.</p>

  <svg id="gw-chart" class="gw-svg" role="img" aria-labelledby="gw-svg-title gw-svg-desc">
    <title id="gw-svg-title">A Gaussian field profile as it evolves</title>
    <desc id="gw-svg-desc">The initial Gaussian is dashed; the solid curve shows the field at the selected time along a diameter through its center.</desc>
  </svg>

  <div class="gw-legend" role="group" aria-label="Profile visibility">
    <button class="gw-key" type="button" data-series="initial" aria-pressed="true">
      <span class="gw-swatch initial" aria-hidden="true"></span>Initial Gaussian
    </button>
    <button class="gw-key" type="button" data-series="current" aria-pressed="true">
      <span class="gw-swatch" aria-hidden="true"></span>At selected time
    </button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
  <script>
    (() => {
      const root = document.getElementById("gaussian-wave-visual");
      const svg = d3.select(root.querySelector("#gw-chart"));
      const modelSelect = root.querySelector("#gw-model");
      const timeSlider = root.querySelector("#gw-time");
      const timeValue = root.querySelector("#gw-time-value");
      const stateText = root.querySelector("#gw-description");
      const svgDescription = root.querySelector("#gw-svg-desc");
      const initialButton = root.querySelector('[data-series="initial"]');
      const currentButton = root.querySelector('[data-series="current"]');
      const playButton = root.querySelector("#gw-play");
      const line = d3.line().x(d => d.x).y(d => d.y).curve(d3.curveMonotoneX);
      const nX = 400;
      const xSamples = d3.range(nX + 1).map(i => -10 + 20 * i / nX);
      const initial = xSamples.map(x => ({ x, y: Math.exp(-0.5 * x * x) }));
      const kSteps = 400;
      const kMax = 8;
      const dk = kMax / kSteps;
      const kgModes = d3.range(kSteps + 1).map(i => {
        const k = i * dk;
        const simpson = i === 0 || i === kSteps ? 1 : i % 2 === 0 ? 2 : 4;
        return {
          k,
          omega: Math.sqrt(k * k + 4),
          weight: Math.sqrt(2 / Math.PI) * simpson * dk / 3 * k * k * Math.exp(-0.5 * k * k)
        };
      });
      const sinc = value => Math.abs(value) < 1e-8 ? 1 : Math.sin(value) / value;
      const q = value => value * Math.exp(-0.5 * value * value);
      const visibleRadius = 8;
      const fixedXDomain = d3.extent(xSamples.filter(x => Math.abs(x) <= visibleRadius));
      const fixedAmplitudeExtent = d3.extent([-1, 1, ...initial.map(d => d.y)]);
      const fixedAmplitudePad = (fixedAmplitudeExtent[1] - fixedAmplitudeExtent[0]) * 0.08;
      const fixedYDomain = [fixedAmplitudeExtent[0] - fixedAmplitudePad, fixedAmplitudeExtent[1] + fixedAmplitudePad];
      let showInitial = true;
      let showCurrent = true;
      let tau = Number(timeSlider.value);
      let isPlaying = false;
      let lastFrameTimestamp = null;
      let lastDrawTimestamp = 0;
      let animationFrame = 0;
      const playbackRate = 0.65;

      function fieldAt(x, model, time) {
        if (time === 0) return Math.exp(-0.5 * x * x);
        if (model === "wave1d") {
          return 0.5 * (Math.exp(-0.5 * (x - time) ** 2) + Math.exp(-0.5 * (x + time) ** 2));
        }
        const r = Math.abs(x);
        if (model === "wave3d") {
          if (r < 1e-3) return (1 - time * time) * Math.exp(-0.5 * time * time);
          return (q(r - time) + q(r + time)) / (2 * r);
        }
        let sum = 0;
        for (const mode of kgModes) {
          sum += mode.weight * sinc(mode.k * r) * Math.cos(mode.omega * time);
        }
        return sum;
      }

      function updateDescription() {
        const model = modelSelect.value;
        if (model === "wave1d") {
          stateText.textContent = "Fixed, open view: two half-height pulses keep their width and exit without reflecting.";
          svgDescription.textContent = "A one-dimensional wave with zero initial velocity. The Gaussian separates into two translated half-height pulses without changing width; the plot edges do not reflect waves.";
        } else if (model === "wave3d") {
          stateText.textContent = "Fixed, open view: the radial shell weakens as it expands and exits without reflecting.";
          svgDescription.textContent = "A three-dimensional radial wave with zero initial velocity. The pulse travels outward as a shell and weakens as its energy spreads over larger spheres; the plot edges do not reflect waves.";
        } else {
          stateText.textContent = "True dispersion plus spherical dilution: wavelengths travel at different speeds and exit the fixed, open view.";
          svgDescription.textContent = "The document's small-field Klein-Gordon model, with mR0 equal to 2. Wavelengths travel at different group speeds, while spherical geometry also dilutes the field; the plot edges do not reflect waves.";
        }
      }

      function render() {
        const width = Math.max(320, Math.floor(svg.node().parentElement.getBoundingClientRect().width));
        const height = Math.max(280, Math.min(360, Math.round(width * 0.46)));
        const margin = { top: 18, right: 18, bottom: 50, left: 70 };
        const plotWidth = width - margin.left - margin.right;
        const plotHeight = height - margin.top - margin.bottom;
        const model = modelSelect.value;
        const current = xSamples.map(x => ({ x, y: fieldAt(x, model, tau) }));
        const xScale = d3.scaleLinear().domain(fixedXDomain).range([0, plotWidth]);
        const yScale = d3.scaleLinear().domain(fixedYDomain).range([plotHeight, 0]);

        svg.attr("viewBox", `0 0 ${width} ${height}`);
        svg.selectAll(".gw-draw").remove();
        let defs = svg.select("defs");
        if (defs.empty()) defs = svg.append("defs");
        let clipPath = defs.select("#gw-profile-clip");
        if (clipPath.empty()) clipPath = defs.append("clipPath").attr("id", "gw-profile-clip");
        let clipRect = clipPath.select("rect");
        if (clipRect.empty()) clipRect = clipPath.append("rect");
        clipRect.attr("x", 0).attr("y", 0).attr("width", plotWidth).attr("height", plotHeight);

        const chart = svg.append("g").attr("class", "gw-draw").attr("transform", `translate(${margin.left},${margin.top})`);
        const xAxis = d3.axisBottom(xScale).ticks(Math.min(6, Math.max(3, Math.floor(plotWidth / 95)))).tickSizeOuter(0);
        const yAxis = d3.axisLeft(yScale).ticks(5).tickSize(-plotWidth).tickSizeOuter(0).tickFormat(d3.format(".2~f"));
        chart.append("g").attr("class", "gw-axis gw-y-axis").call(yAxis);
        chart.append("g").attr("class", "gw-axis gw-x-axis").attr("transform", `translate(0,${plotHeight})`).call(xAxis);
        chart.append("line").attr("class", "gw-zero").attr("x1", 0).attr("x2", plotWidth)
          .attr("y1", yScale(0)).attr("y2", yScale(0));
        chart.append("g").attr("clip-path", "url(#gw-profile-clip)").append("path")
          .datum(initial.map(d => ({ x: xScale(d.x), y: yScale(d.y) })))
          .attr("class", "gw-initial").attr("d", line).style("display", showInitial ? null : "none");
        chart.append("g").attr("clip-path", "url(#gw-profile-clip)").append("path")
          .datum(current.map(d => ({ x: xScale(d.x), y: yScale(d.y) })))
          .attr("class", "gw-current").attr("d", line).style("display", showCurrent ? null : "none");
        chart.append("rect").attr("class", "gw-frame").attr("data-chart-frame", "")
          .attr("x", 0).attr("y", 0).attr("width", plotWidth).attr("height", plotHeight).attr("fill", "none");
        svg.append("text").attr("class", "gw-draw axis-title").attr("data-axis", "x")
          .attr("x", margin.left + plotWidth / 2).attr("y", height - 6).attr("text-anchor", "middle")
          .text("position x / R₀");
        svg.append("text").attr("class", "gw-draw axis-title").attr("data-axis", "y")
          .attr("transform", `translate(17,${margin.top + plotHeight / 2}) rotate(-90)`)
          .attr("text-anchor", "middle").text("field ϕ / A₀");

        timeValue.textContent = tau.toFixed(2);
        timeSlider.setAttribute("aria-valuetext", `${tau.toFixed(2)} R0 over c`);
        svgDescription.textContent = `${svgDescription.textContent.split(" At scaled time")[0]} At scaled time c t / R0 = ${tau.toFixed(2)}. The dashed curve is the initial Gaussian; the solid curve is the field now.`;

        const yLabels = chart.selectAll(".gw-y-axis .tick text").nodes();
        const widestYLabel = d3.max(yLabels, node => node.getBBox().width) || 0;
        if (widestYLabel + 24 > margin.left) {
          chart.selectAll(".gw-y-axis .tick text").text(d3.format(".1~f"));
        }
      }

      modelSelect.addEventListener("change", () => {
        updateDescription();
        render();
      });
      timeSlider.addEventListener("input", () => {
        stopPlayback();
        tau = Number(timeSlider.value);
        render();
      });
      initialButton.addEventListener("click", () => {
        showInitial = !showInitial;
        initialButton.setAttribute("aria-pressed", String(showInitial));
        render();
      });
      currentButton.addEventListener("click", () => {
        showCurrent = !showCurrent;
        currentButton.setAttribute("aria-pressed", String(showCurrent));
        render();
      });

      function stopPlayback() {
        isPlaying = false;
        lastFrameTimestamp = null;
        cancelAnimationFrame(animationFrame);
        playButton.textContent = "Play";
        playButton.setAttribute("aria-pressed", "false");
      }

      function advance(timestamp) {
        if (!isPlaying) return;
        if (lastFrameTimestamp !== null) {
          const elapsed = Math.max(0, Math.min((timestamp - lastFrameTimestamp) / 1000, 0.08));
          tau += elapsed * playbackRate;
          if (tau >= Number(timeSlider.max) - 0.5) {
            timeSlider.max = String(Math.ceil((tau + 5) / 5) * 5);
          }
          timeSlider.value = String(tau);
          if (timestamp - lastDrawTimestamp >= 50) {
            render();
            lastDrawTimestamp = timestamp;
          }
        }
        lastFrameTimestamp = timestamp;
        animationFrame = requestAnimationFrame(advance);
      }

      playButton.addEventListener("click", () => {
        if (isPlaying) {
          stopPlayback();
          return;
        }
        isPlaying = true;
        lastFrameTimestamp = null;
        lastDrawTimestamp = 0;
        playButton.textContent = "Pause";
        playButton.setAttribute("aria-pressed", "true");
        animationFrame = requestAnimationFrame(advance);
      });

      updateDescription();
      render();
      new ResizeObserver(render).observe(svg.node().parentElement);
    })();
  </script>
</div>
